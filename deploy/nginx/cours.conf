# /etc/nginx/sites-available/cours.conf
# Reverse-proxy HTTPS devant l'application (qui écoute sur 127.0.0.1:3000).
#
#   sudo ln -s /etc/nginx/sites-available/cours.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d cours.exemple.fr      # certificat Let's Encrypt
#   sudo nginx -t && sudo systemctl reload nginx
#
# Dans .env :  APP_ORIGIN=https://cours.exemple.fr  TRUST_PROXY=1  COOKIE_SECURE=true

server {
    listen 80;
    listen [::]:80;
    server_name cours.exemple.fr;
    # Défi ACME de certbot, puis redirection permanente vers HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cours.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/cours.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cours.exemple.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Doit être >= MAX_UPLOAD_MB (+ marge pour l'encodage multipart)
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # On REMPLACE l'en-tête (pas d'ajout) : le client ne peut pas usurper son IP
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Uploads volumineux : transmis au fil de l'eau, délais généreux
        proxy_request_buffering off;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }
}
